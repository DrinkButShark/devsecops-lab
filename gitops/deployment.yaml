apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo
  labels:
    app: devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-demo

  template:
    metadata:
      labels:
        app: devsecops-demo

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: devsecops-demo
          image: ghcr.io/drinkbutshark/devsecops-lab:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"


---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-demo
spec:
  selector:
    app: devsecops-demo

  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

  type: ClusterIP
